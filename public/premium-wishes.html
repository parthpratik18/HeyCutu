<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HeyCutu ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Caveat+Brush&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#2a2350;--ink:#2a2350;--mut:rgba(42,35,80,.74);--dot:rgba(42,35,80,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16122e;--card:#231d47;--tx:#f5f1ff;--ink:#8f82f5;--mut:rgba(245,241,255,.78);--dot:rgba(245,241,255,.09)}}
:root[data-theme="dark"]{--bg:#16122e;--card:#231d47;--tx:#f5f1ff;--ink:#8f82f5;--mut:rgba(245,241,255,.78);--dot:rgba(245,241,255,.09)}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{--a:#ff5d9e;--b:#ffd23f;--c:#7ae0c3;margin:0;min-height:100%;overflow-x:hidden;font:400 17px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:radial-gradient(var(--dot) 1.6px,transparent 1.7px) 0 0/24px 24px,linear-gradient(180deg,color-mix(in srgb,var(--a) 16%,transparent),transparent 45vh),var(--bg)}
.c-g{--a:#ff5d9e;--b:#ffd23f;--c:#7ae0c3}
.c-b{--a:#3f8cff;--b:#ffb020;--c:#8be07a}
.c-h{--a:#ff4d6d;--b:#c28bff;--c:#ffd9a0}
.c-m{--a:#2f6bff;--b:#f5b942;--c:#ff9aa8}
h1,h2,.name{font-family:"Caveat Brush","Comic Sans MS",cursive;font-weight:400;margin:0;line-height:1.05}
#dd{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#dd span{position:absolute;opacity:.45;animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
#cf{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.pop{position:fixed;z-index:6;pointer-events:none;font-size:26px}
nav{position:relative;z-index:2;display:flex;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
nav a,nav button{flex:none;padding:9px 16px;border-radius:999px;border:2.5px solid var(--ink);background:var(--card);color:var(--tx);text-decoration:none;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
nav a:hover,nav button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
nav a.on{background:var(--a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
nav>:first-child{margin-left:auto}nav>:last-child{margin-right:auto}
.panel{position:relative;z-index:2;max-width:660px;margin:4px auto 12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel textarea{grid-column:1/-1;min-height:84px;resize:vertical}
input,textarea{width:100%;padding:11px 14px;border-radius:14px;border:2.5px solid var(--ink);background:var(--bg);color:var(--tx);font:700 16px Nunito,system-ui,sans-serif}
.st{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink)}
main{position:relative;z-index:1}
.hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 18px 30px;text-align:center}
.tagc{display:inline-block;padding:7px 18px;background:var(--b);color:#2a2350;font-weight:800;border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
h1{font-size:clamp(46px,12vw,104px);color:var(--a);text-shadow:3px 3px 0 var(--ink)}
.name{position:relative;font-size:clamp(40px,10vw,84px);overflow-wrap:anywhere}
.scr{display:block;width:min(70vw,360px);height:22px;margin:0 auto}
.scr path{stroke:var(--b);stroke-width:7;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.go .scr path{animation:dr 1.1s .7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.orb{position:relative;width:min(74vw,300px);aspect-ratio:1;margin:6px 0;--r:min(34vw,140px)}
.orb b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,20vw,110px);font-weight:400;animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.1) rotate(6deg)}}
.orb i{position:absolute;left:50%;top:50%;margin:-.6em;font-size:32px;font-style:normal;animation:orb 16s linear infinite}
@keyframes orb{from{transform:rotate(var(--s)) translateX(var(--r)) rotate(calc(-1 * var(--s)))}to{transform:rotate(calc(var(--s) + 360deg)) translateX(var(--r)) rotate(calc(-1 * var(--s) - 360deg))}}
.go .hero>*{animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * .1s)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.sub{margin:0;max-width:26em;font-size:19px;font-weight:700;color:var(--mut)}
.btn{display:inline-block;padding:12px 24px;border:3px solid var(--ink);border-radius:999px;background:var(--a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);font:800 17px Nunito,system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--tx);text-shadow:none}
:is(a,button,input,textarea):focus-visible{outline:3px solid var(--a);outline-offset:3px}
.mq{overflow:hidden;border-block:3px solid var(--ink);background:var(--b);color:#2a2350;padding:11px 0;margin:10px -12px;transform:rotate(-1.2deg);font:400 26px "Caveat Brush","Comic Sans MS",cursive}
.mq div{display:flex;gap:34px;width:max-content;animation:mq 24s linear infinite}
.mq span{white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
section{max-width:940px;margin:0 auto;padding:46px 18px}
h2{font-size:clamp(34px,7vw,54px);text-align:center;margin-bottom:24px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}
.rv.show{opacity:1;transform:none}
.paper{position:relative;max-width:620px;margin:8px auto 0;padding:30px 26px 20px;line-height:32px;font-size:19px;font-weight:700;transform:rotate(-1deg);background:repeating-linear-gradient(var(--card),var(--card) 31px,color-mix(in srgb,var(--a) 35%,transparent) 32px)}
.paper::before{content:"";position:absolute;top:-15px;left:50%;width:96px;height:28px;background:var(--b);border:2.5px solid var(--ink);transform:translateX(-50%) rotate(3deg);opacity:.9}
.paper p{margin:0}
.sig{margin-top:12px!important;text-align:right;font:400 30px "Caveat Brush","Comic Sans MS",cursive;color:var(--a)}
#msg::after{content:"▍";opacity:.6;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.fc{perspective:800px;height:178px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.fc:nth-child(odd){rotate:-2deg}.fc:nth-child(even){rotate:2deg}
.fc>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.fc.on>div{transform:rotateY(180deg)}
.fc span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .ft{background:color-mix(in srgb,var(--b) 38%,var(--card))}
.fc .bk{transform:rotateY(180deg);background:var(--c);color:#2a2350;font-weight:700}
.fc em{font-style:normal;font-size:46px;line-height:1.1}
.fc strong{font:400 25px "Caveat Brush","Comic Sans MS",cursive}
.wishc{max-width:520px;margin:0 auto;padding:26px;text-align:center}
.wishc svg{width:min(60vw,230px);height:auto;filter:drop-shadow(0 8px 0 color-mix(in srgb,var(--ink) 22%,transparent))}
.wishc .art{margin-bottom:12px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
[data-only]{display:none}
body[data-kind="b"] [data-only="b"],body[data-kind="a"] [data-only="a"]{display:revert}
.heart{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk .28s ease-in-out infinite alternate}
@keyframes fk{to{transform:scale(.82,1.14) rotate(4deg)}}
.out .fl{animation:none;opacity:0;transform:scale(.2);transition:.5s}
.ey{transform-box:fill-box;transform-origin:center;animation:bk 4s infinite}
@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fin{text-align:center}
.fin h2{font-size:clamp(40px,9vw,72px);color:var(--a);text-shadow:3px 3px 0 var(--ink)}
.fin p{max-width:28em;margin:0 auto 20px;font-weight:700;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
footer{position:relative;z-index:1;padding:20px 18px 44px;text-align:center;color:var(--mut);font-weight:700}
.c-p{--a:#ff4f8b;--b:#ffcf3f;--c:#62e0d0}
.c-p h1{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;-webkit-text-stroke:2px var(--ink);filter:drop-shadow(3px 3px 0 var(--ink))}
body[data-pg="p"] [data-only="p"]{display:revert}
select{width:100%;padding:11px 14px;border-radius:14px;border:2.5px solid var(--ink);background:var(--bg);color:var(--tx);font:700 16px Nunito,system-ui,sans-serif}
.fileb{display:none;grid-column:1/-1;padding:10px 14px;border:2.5px dashed var(--ink);border-radius:14px;font-weight:800;flex-direction:column;gap:6px}
body[data-pg="p"] .fileb{display:flex}
.fileb input{border:0;padding:0;background:none}
.orb.pw{width:min(90vw,410px);--r:min(42vw,196px)}
.pol{position:absolute;left:50%;top:50%;width:60%;translate:-50% -50%;rotate:-3deg;padding:8px 8px 10px;background:#fff;color:#2a2350;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transition:transform .2s ease-out;z-index:1}
.pf{position:relative;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 45%,#fff);border:2px solid var(--ink)}
.pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf .em{font-size:52px}
.pf img[src]~.em{display:none}
.pf::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);transform:translateX(-120%);animation:shine 4s 1.6s infinite}
@keyframes shine{to{transform:translateX(120%)}}
.rvl{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;color:#fff;font:800 16px Nunito,system-ui,sans-serif;background:repeating-linear-gradient(45deg,var(--a) 0 14px,var(--b) 14px 28px);cursor:pointer;transition:transform .9s cubic-bezier(.7,0,.2,1)}
.rvl em{font-style:normal;font-size:40px}
.open .rvl{transform:translateY(-105%)}
.pc{padding-top:6px;text-align:center;font:600 24px/1.1 Caveat,"Comic Sans MS",cursive}
.pimg:not([src]){display:none!important}
.diary{position:relative;max-width:640px;margin:8px auto 0;padding:26px 22px 22px 60px;font:600 24px/32px Caveat,"Comic Sans MS",cursive;background:repeating-linear-gradient(var(--card),var(--card) 31px,color-mix(in srgb,var(--c) 60%,transparent) 32px)}
.diary::before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:22px;background:radial-gradient(circle at 11px 16px,var(--bg) 0 6px,var(--ink) 7px 9px,transparent 10px) 0 0/22px 64px repeat-y}
.diary h3{margin:0;font:400 28px "Caveat Brush","Comic Sans MS",cursive;color:var(--a)}
.diary p{margin:0;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;line-height:1.2}
.chips span{padding:5px 12px;border:2.5px solid var(--ink);border-radius:8px;color:#2a2350;font:600 21px Caveat,"Comic Sans MS",cursive;box-shadow:3px 3px 0 var(--ink)}
.chips span:nth-child(3n+1){background:var(--b);rotate:-2deg}.chips span:nth-child(3n+2){background:var(--c);rotate:2deg}.chips span:nth-child(3n){background:color-mix(in srgb,var(--a) 40%,#fff);rotate:-1deg}
.dph{display:none;position:absolute;right:14px;top:-26px;width:96px;padding:5px 5px 14px;background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);rotate:5deg}
.dph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.hasph .dph{display:block}
.fring{display:none;width:120px;aspect-ratio:1;margin:0 auto 14px;border-radius:50%;object-fit:cover;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.hasph .fring{display:block}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="dd" aria-hidden="true"></div>
<canvas id="cf" aria-hidden="true"></canvas>
<nav aria-label="Pages">
  <a href="#photo-birthday" data-k="photo-birthday" data-g="photo">📸 Photo wish ✨ New</a>
  <a href="#birthday-girl" data-k="birthday-girl">🎀 Birthday · Girl</a>
  <a href="#birthday-boy" data-k="birthday-boy">🎮 Birthday · Boy</a>
  <a href="#anniversary-her" data-k="anniversary-her">💖 Anniversary · Her</a>
  <a href="#anniversary-him" data-k="anniversary-him">👑 Anniversary · Him</a>
  <button id="ed" aria-expanded="false" aria-controls="pn">✏️ Personalize</button>
  <button id="tg" aria-label="Switch light or dark theme">◐</button>
</nav>
<div class="panel st" id="pn" hidden>
  <input id="to" placeholder="Their name" maxlength="24" aria-label="Their name">
  <input id="fr" placeholder="Your name" maxlength="24" aria-label="Your name">
  <input id="nu" type="number" min="1" max="120" placeholder="Age or years together" aria-label="Age or years together">
  <select id="oc" data-only="p" aria-label="Occasion"><option value="photo-birthday">🎂 Birthday</option><option value="photo-anniversary">💖 Anniversary</option></select>
  <textarea id="ds" maxlength="500" placeholder="Describe them for the diary: what they love, their quirks… (separate with commas)" aria-label="Describe your partner"></textarea>
  <label class="fileb">📷 Their photo (stays on your device)<input id="ph" type="file" accept="image/*"></label>
  <textarea id="cm" maxlength="400" placeholder="Write your own message (leave empty to use ours)" aria-label="Your message"></textarea>
</div>
<main id="mm">
  <header class="hero">
    <span class="tagc" id="tag" style="--i:0"></span>
    <h1 id="ttl" style="--i:1"></h1>
    <div style="--i:2"><div class="name" id="nmE"></div>
      <svg class="scr" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M4 14C50 3 110 21 170 10s90 8 126 2"/></svg></div>
    <div class="orb" id="orb" style="--i:3" aria-hidden="true"></div>
    <p class="sub" id="sub" style="--i:4"></p>
    <a class="btn" href="#letter" style="--i:5">Open your gift ⬇</a>
  </header>
  <div class="mq" aria-hidden="true"><div id="mq1"></div></div>
  <section id="letter" class="rv">
    <h2>💌 A letter for you</h2>
    <article class="paper st"><p id="msg"></p><p class="sig" id="sig"></p></article>
  </section>
  <section class="rv">
    <h2>✨ Why you’re so loved</h2>
    <div class="grid" id="rs"></div>
  </section>
  <section class="rv" id="dsec">
    <h2>📖 My diary</h2>
    <article class="diary st"><div class="dph"><img class="pimg" alt=""></div><h3 id="dh"></h3><p id="dt"></p><div class="chips" id="ch"></div></article>
  </section>
  <section class="rv">
    <h2 id="sec"></h2>
    <div class="wishc st">
      <div class="art">
        <svg id="cake" data-only="b" viewBox="0 0 200 180" aria-hidden="true" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">
          <rect x="28" y="110" width="144" height="54" rx="12" fill="var(--b)"/>
          <rect x="50" y="68" width="100" height="46" rx="11" fill="var(--a)"/>
          <path d="M50 80q10 16 20 0t20 0 20 0 20 0 20 0v-12H50z" fill="#fff"/>
          <path d="M28 122q12 16 24 0t24 0 24 0 24 0 24 0 24 0v-12H28z" fill="#fff"/>
          <g fill="#fff"><rect x="77" y="44" width="7" height="24" rx="2"/><rect x="97" y="40" width="7" height="28" rx="2"/><rect x="117" y="44" width="7" height="24" rx="2"/></g>
          <g fill="#ffcf4d" stroke="none"><ellipse class="fl" cx="80" cy="36" rx="5" ry="9"/><ellipse class="fl" cx="100" cy="32" rx="5" ry="9"/><ellipse class="fl" cx="120" cy="36" rx="5" ry="9"/></g>
          <g fill="#2a2350" stroke="none"><circle class="ey" cx="82" cy="146" r="3.5"/><circle class="ey" cx="118" cy="146" r="3.5"/></g>
          <path d="M93 150q7 7 14 0" fill="none" stroke="#2a2350" stroke-linecap="round"/>
          <g fill="#ff8fb3" stroke="none" opacity=".75"><ellipse cx="68" cy="152" rx="6" ry="4"/><ellipse cx="132" cy="152" rx="6" ry="4"/></g>
        </svg>
        <svg class="heart" id="hrt" data-only="a" viewBox="0 0 100 90" aria-hidden="true" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">
          <path d="M50 85C20 62 4 44 4 27 4 13 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 9 24 23 0 17-16 35-46 58z" fill="var(--a)"/>
          <g fill="#fff" stroke="none"><circle class="ey" cx="37" cy="36" r="4"/><circle class="ey" cx="63" cy="36" r="4"/></g>
          <path d="M43 47q7 8 14 0" fill="none" stroke="#fff" stroke-linecap="round"/>
          <g fill="#fff" stroke="none" opacity=".45"><ellipse cx="29" cy="46" rx="5" ry="3"/><ellipse cx="71" cy="46" rx="5" ry="3"/></g>
        </svg>
      </div>
      <p data-only="a" id="cnt" style="margin:0 0 12px;font-weight:800"></p>
      <button class="btn" id="b1"></button>
    </div>
  </section>
  <div class="mq" aria-hidden="true"><div id="mq2"></div></div>
  <section class="fin rv">
    <img class="pimg fring" alt=""><h2 id="fh"></h2>
    <p id="fp"></p>
    <div class="row"><button class="btn" id="pty">🎉 Party time</button><button class="btn alt" id="hug">🤗 Send a hug back</button></div>
    <p id="hm" style="margin-top:18px;font-weight:800"></p>
  </section>
</main>
<footer>Made with 💗 on HeyCutu</footer>
<script>
const $=id=>document.getElementById(id);
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const T={
"photo-birthday":{c:"p",k:"b",p:1,to:"Superstar",ce:"🎂",tag:"A gift made just for you 📸",e:["🎂","📸","🎈","✨","💖","🎁","🌈","🎉","🧁","⭐"]},
"photo-anniversary":{c:"p",k:"a",p:1,to:"My Love",ce:"💝",tag:"Our story, in one frame 📸",e:["💖","📸","🌹","✨","💞","🥂","🦋","💍","🌙","💫"]},
"birthday-girl":{c:"g",k:"b",to:"Princess",ce:"🎂",tag:"Surprise! It’s your day 🎀",e:["🎀","🌸","🦄","🧁","🍭","💖","✨","🎈","🌈","🍓"]},
"birthday-boy":{c:"b",k:"b",to:"Champ",ce:"🎁",tag:"Level up! It’s your day 🚀",e:["🎮","🚀","⚡","🏆","🎸","🛹","🎈","🔥","🦖","⭐"]},
"anniversary-her":{c:"h",k:"a",to:"My Love",ce:"💝",tag:"Two hearts, one story 💖",e:["💖","🌹","💌","🥂","🕊️","💍","✨","🦋","🌙","💞"]},
"anniversary-him":{c:"m",k:"a",to:"My King",ce:"💙",tag:"Side by side, always 👑",e:["👑","💙","🥂","🌟","💍","🏔️","☕","🎶","💫","❤️"]}
};
const K={
b:{ttl:"Happy Birthday",sub:"{f} made this little party just for you.",sec:"🎂 Make a wish",wb:"🕯️ Blow the candles",
 msg:"Dear {n}, today the whole world gets one more reason to smile, because it’s your day. Thank you for being exactly you. I hope this year is full of laughter, cake and every dream you carry. Happy Birthday!",
